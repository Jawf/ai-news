[project]
name = "ai-news"
version = "0.1.0"
description = "每日财经新闻 Job 管理器"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.1.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "pyyaml>=6.0.3",
    "schedule>=1.2.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.setuptools]
packages = ["ainews"]
