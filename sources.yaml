# 配置驱动的新闻源。新增源 = 加一条配置,无需改代码。
# tushare.pro/news/{slug} 为需登录 cookie 的服务端渲染 HTML,结构统一。
# poll_interval=3600 每小时抓一次;每次拉最新约1000条,靠 content_hash 去重,只有新增条目入库(增量)。
- id: xq
  name: 雪球
  enabled: true
  type: html
  endpoint: "https://tushare.pro/news/xq"
  method: GET
  params: {}
  headers: { Cookie: "${TUSHARE_COOKIE}", User-Agent: "Mozilla/5.0" }
  mapping: { item_selector: ".news_item", time_selector: ".news_datetime", content_selector: ".news_content" }
  poll_interval: 3600

