- id: xq
  name: 雪球
  enabled: true
  type: html
  endpoint: "https://tushare.pro/news/xq"
  method: GET
  params: {}
  headers:
    Cookie: "${TUSHARE_COOKIE}"
    User-Agent: "Mozilla/5.0"
  mapping:
    item_selector: ".news_item"
    time_selector: ".news_datetime"
    content_selector: ".news_content"
  poll_interval: 300

